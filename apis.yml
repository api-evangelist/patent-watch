name: Patent Watch
description: >-
  Patent Watch (PatentWatch.ai) is a Toronto-based, Y Combinator-backed (F25)
  legal-tech startup building AI for patent intelligence and infringement
  detection. Its platform interprets patents, maps them to competing products,
  and generates claim charts that show who is infringing and how, so IP teams
  can find licensing and litigation targets, send cease-and-desist letters,
  pursue counter-litigation, sell IP in wind-downs, and accelerate M&A
  diligence. It also runs AI invalidity and prior-art searches to help patents
  hold up in court. Founded in 2024 by Alexander and Andreas Stroe, the company
  raised a $2.8M seed round in April 2026. As of this profile Patent Watch is an
  early-stage product with a marketing site and login only, and no public
  developer, API, or documentation surface; this repo tracks it as an enrichment
  lead in the API Evangelist network.
